        <i>Available from Spring through Summer</i>

        <p>A LOCAL FAVORITE:</p>
        <p><b>Wild Rosa Petal Tea </b>is a top local choice. The wildflower is widely abundant and it has a pleasant, sweet aroma. The tea is mellow to the tongue and uniquely tangy with slight bitterness in flavor. Adding honey or maple syrup is recommended.</p>
        <details>
            <summary><i>See all teas & Pricing</i></summary>
            <ul>
                <li>Wild Rosa Petal Tea ($7) - As explained above, this is a great drink to feel and seep into the local nature.</li>
                <li>Wild Cherry Leaf Tea ($6) - With a distinct scent and a quite bitter taste, we recommend adding sweeteners. It is widely available in the local environment.</li>
                <li>Wild Forget-Me-Not Flower Tea ($9) - Locally, there is a limited availability in foraging this flower orgnically. Very pleasant, exquisite scent and slight sweetness in taste.</li>
                <li>Homegrown Mint Tea ($7) - Currently out of stock.</li>

    <button class="dark">
        <h4>Holiday Wreaths</h4>
        <i>Available from late Autumn to early Winter</i>
        <br>
        <h5>We focus on sustainability of this seasonal organic decor through the reuse of natural frames (which are made from fallen evergreen branches) to reduce resource usage (leaves which are composted after winter) and increase crafting efficiency. After the first year a frame is crafted (still attached to the leaves), they are returned by customers & reused indefinitely.</h5>
        <p>RECOMMENDED WREATH TYPE:</p>
        <img src="img/wreath-small.jpg" class="photo" id="vimg">
        <p><b>Small Pine Leaf Wreaths </b>are a great choice for decorating your bedroom door with both a visually and aromatically appealing holiday atmosphere.</p>
        <details>
            <summary><i>Details, Pricing, & Terms</i></summary>
            <p>Frame Diameter (Size)</p>
            <ul>
                <li>Large ($25) - 15 to 18 inches. Great as outdoor decor. Difficult to craft structurally.</li>
                <li>Medium ($20) - 11 to 14 inches. Great as both indoor and outdoor decor. Easiest size to craft.</li>
                <li>Small ($15) - 8 to 10 inches. Great as indoor deor. Difficult to craft aesthetically.</li>
            </ul>
            <p>Wood Type</p>
            <ul>
                <li>Mixed Leaves ($20) - Most sustainable option. Any available evergreen leaves are used. Great for enjoying varying scents.</li>
                <li>Pine Leaves($25) - More abundant wood type. Not as easy to craft aesthetically. Still a decent budget choice for many.</li>
                <li>Fir Leaves ($35) - Quite difficult to source and craft. Very limited availability.</li>
            </ul>
            <i>For ordering, the wood choice for the frames and whether they are naturally attached or not cannot be specified. It is fully dependent on availability at the time.</i>
            <p>TERMS FOR THIS PRODUCT</p>
            <ul>
                <li><u>Limited Delivery</u>: Due to the nature of this product being organic and too large for mail delivery, only our personal delivery within the Eastside region is offered. We strongly recommend you to come pickup this product.</li>
                <li><u>Quality & Aesthetics</u>: We cannot guarantee that aesthetics and our artistic choices for this product will align with the customer. This reason is not subject to initiating a return.</li>
                <li><u>Collection for Reuse</u>: As explained above, we try to reuse all wreath frames every year. If you do coorporate with us in this sustainability effort by returning the wreath frame to us, you will receive a $10 refund for your order.</li>
            </ul>
        </details>
    </button>
